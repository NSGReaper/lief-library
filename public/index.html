<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eldritch Archer — Combat Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ══════════════════════════════════════════
     UPLOAD SCREEN
══════════════════════════════════════════ -->
<div id="upload-section" class="upload-screen">
  <div class="upload-title">Eldritch Archer</div>
  <div class="upload-subtitle">Combat Tracker · Pathfinder</div>

  <div id="drop-zone" class="drop-zone">
    <div class="drop-zone-icon">🏹</div>
    <div class="drop-zone-text">Drop your Hero Lab portfolio here<br>or click to browse</div>
  </div>

  <input type="file" id="portfolio-file" accept=".por" style="display:none" />
  <div id="upload-status" class="upload-status"></div>

  <div class="upload-divider">or browse a local file</div>

  <div id="file-browser">
    <div id="browser-shortcuts" class="browser-shortcuts"></div>
    <div class="browser-path-row">
      <input id="watch-path-input" class="watch-input" type="text"
             placeholder="C:\path\to\character.por" />
      <button id="browser-up-btn" class="watch-btn" disabled title="Go up one folder">↑</button>
    </div>
    <div id="browser-list" class="browser-list"></div>
    <div id="watch-status" class="upload-status"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════ -->
<div id="app-section" style="display:none">
<div class="attack-card">

  <!-- HEADER -->
  <div class="card-header-custom">
    <div class="d-flex align-items-start justify-content-between gap-2">
      <div>
        <div class="char-name" id="char-name">—</div>
        <div class="char-meta" id="char-summary">—</div>
      </div>
      <div class="d-flex flex-column align-items-end gap-1">
        <span class="action-badge mt-1">Full Attack</span>
        <span id="watch-indicator"></span>
        <a href="#" id="change-character-link" class="change-char-link">change character</a>
      </div>
    </div>
  </div>

  <div class="card-content-wrapper">
    <!-- LEFT COLUMN: Character Options -->
    <div class="card-column-left">

  <!-- PER-ATTACK OPTIONS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-per-attack"></span>
      <span class="section-eyebrow per-attack">Per-Attack Decisions</span>
    </div>
    <div class="toggle-grid" id="options-grid-per-attack"></div>
  </div>

  <!-- SWIFT-ACTION BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-arcane-pool"></span>
      <span class="section-eyebrow arcane-pool">Arcane Pool</span>
    </div>
    <div class="toggle-grid" id="options-grid-arcane-pool"></div>
    <div class="enhancement-budget-display" id="enhancement-budget-display" style="display:none"></div>
    <div class="toggle-grid" id="options-grid-arcane-pool-properties"></div>
  </div>

  <!-- CONDITIONAL BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-conditional"></span>
      <span class="section-eyebrow conditional">Conditional</span>
    </div>
    <div class="toggle-grid" id="options-grid-conditional"></div>
  </div>

  <!-- ACTIVE BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-buff"></span>
      <span class="section-eyebrow buff">Active Buffs</span>
    </div>
    <div class="toggle-grid" id="options-grid-buff"></div>
  </div>

    </div>
    <!-- End LEFT COLUMN -->

    <!-- RIGHT COLUMN: Weapon & Attacks -->
    <div class="card-column-right">

  <!-- WEAPON -->
  <div class="weapon-row">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="weapon-name">
        <span id="weapon-name">—</span>
        <span class="crit-tag" id="weapon-crit"></span>
      </div>
      <div class="d-flex flex-wrap gap-1">
        <span class="stat-pill">RNG <span id="weapon-range">—</span></span>
        <span class="stat-pill" id="weapon-dmg-type-pill">Type <span id="weapon-damage-type">—</span></span>
      </div>
    </div>
    <div class="weapon-situational" style="display:none">
      <small class="text-muted" id="situational-modifiers"></small>
    </div>
  </div>

  <!-- ARCANE POOL -->
  <div class="arcane-pool-row">
    <div class="d-flex align-items-center justify-content-between">
      <span class="pool-label">Arcane Pool Points</span>
      <div id="arcane-pips"></div>
    </div>
    <div class="arcane-cost-display" id="arcane-cost-display" style="display:none"></div>
  </div>

  <!-- ATTACKS -->
  <div class="attacks-section">
    <div class="section-label">Full Attack</div>
    <div id="attacks-list"></div>
  </div>

  <!-- SPELL SELECTOR -->
  <div class="spell-selector-panel" id="spell-selector-panel" style="display:none">
    <div class="spell-selector-header">
      <span class="spell-selector-title">⚡ Select Spellstrike Spell</span>
      <button class="spell-selector-close" id="spell-selector-close">✕ Close</button>
    </div>
    <div class="spell-list" id="spell-list"></div>
  </div>

    </div>
    <!-- End RIGHT COLUMN -->
  </div>
  <!-- End card-content-wrapper -->

  <!-- FOOTER -->
  <div class="card-footer-custom">
    <button class="reset-btn" id="reset-round-btn">New Round</button>
  </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
