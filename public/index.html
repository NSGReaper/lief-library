<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eldritch Archer — Combat Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────── */
    :root {
      --bg-deep:        #090c14;
      --bg-card:        #0d1220;
      --bg-section:     #111827;
      --border-dim:     #1e2d4a;
      --border-glow:    #c8922a;
      --gold:           #d4a93a;
      --gold-light:     #f0cc6a;
      --gold-dim:       #7a5c1a;
      --teal:           #4fc3f7;
      --teal-glow:      #0ea5e9;
      --teal-dim:       #1a4a6a;
      --orange:         #fb923c;
      --orange-dim:     #7c3a1a;
      --spell-purple:   #a78bfa;
      --spell-glow:     #7c3aed;
      --text-primary:   #e8dfc8;
      --text-dim:       #8a8070;
      --crit-red:       #f87171;
      --hit-green:      #86efac;
      --dmg-amber:      #fbbf24;

      /* damage type colours */
      --dmg-fire:        #f97316;
      --dmg-acid:        #84cc16;
      --dmg-cold:        #38bdf8;
      --dmg-electricity: #facc15;
      --dmg-sonic:       #a78bfa;
      --dmg-force:       #c084fc;
      --dmg-bleed:       #f43f5e;
    }

    body {
      background: var(--bg-deep);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      font-family: 'Crimson Pro', Georgia, serif;
      color: var(--text-primary);
    }

    /* ── UPLOAD SCREEN ─────────────────────────────────────── */
    .upload-screen {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
      padding-top: 6rem;
    }

    .upload-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
      text-shadow: 0 0 24px #d4a93a44;
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
    }

    .upload-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }

    .drop-zone {
      border: 2px dashed var(--border-dim);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--bg-card);
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--gold);
      background: #0e1525;
    }

    .drop-zone-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    .drop-zone-text {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .upload-status {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      margin-top: 1rem;
      min-height: 1.2em;
    }

    .upload-status.loading { color: var(--teal); }
    .upload-status.success  { color: var(--hit-green); }
    .upload-status.error    { color: var(--crit-red); }

    /* ── CARD SHELL ────────────────────────────────────────── */
    .attack-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      box-shadow:
        0 0 0 1px #c8922a22,
        0 0 30px #c8922a18,
        0 8px 32px #00000088;
      overflow: hidden;
    }

    .attack-card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    /* ── HEADER ────────────────────────────────────────────── */
    .card-header-custom {
      padding: 1.1rem 1.4rem 0.9rem;
      border-bottom: 1px solid var(--border-dim);
    }

    .char-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.06em;
      text-shadow: 0 0 18px #d4a93a55;
    }

    .char-meta {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    .action-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bg-deep);
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      border-radius: 2px;
      padding: 0.25em 0.65em;
    }

    .change-char-link {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      opacity: 0.6;
    }

    .change-char-link:hover { opacity: 1; color: var(--gold-dim); }

    /* ── ARCANE POOL ───────────────────────────────────────── */
    .arcane-pool-row {
      padding: 0.65rem 1.4rem;
      border-bottom: 1px solid var(--border-dim);
      background: #0b1019;
    }

    .pool-label {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .pool-available {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      color: var(--teal);
      letter-spacing: 0.06em;
      margin-left: 0.5rem;
    }

    .pool-pip {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid var(--teal);
      display: inline-block;
      margin: 0 2px;
      cursor: pointer;
      transition: box-shadow 0.2s, background 0.2s;
    }

    .pool-pip.filled {
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal-glow), 0 0 12px var(--teal-glow);
    }

    .pool-pip.committed {
      background: #1a4060;
      border-color: var(--teal-dim);
      box-shadow: 0 0 4px var(--teal-dim);
    }

    .pool-pip.spent {
      background: #1a2030;
      border-color: #2a3550;
    }

    .arcane-cost-display {
      font-family: 'Crimson Pro', serif;
      font-size: 0.7rem;
      color: var(--spell-purple);
      margin-top: 0.25rem;
    }

    /* ── WEAPON ────────────────────────────────────────────── */
    .weapon-row {
      padding: 0.75rem 1.4rem;
      border-bottom: 1px solid var(--border-dim);
      background: #0e1520;
    }

    .weapon-name {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.04em;
    }

    .crit-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--crit-red);
      background: #2a0f0f;
      border: 1px solid #7f1d1d;
      border-radius: 2px;
      padding: 0.1em 0.4em;
      margin-left: 4px;
      vertical-align: middle;
    }

    .stat-pill {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      background: #0a111d;
      border: 1px solid var(--border-dim);
      border-radius: 3px;
      padding: 0.18em 0.5em;
    }

    .stat-pill span { color: var(--text-primary); }

    /* ── TOGGLE SECTIONS ────────────────────────────────────── */
    .toggle-section {
      padding: 0.6rem 1.4rem 0.75rem;
      border-bottom: 1px solid var(--border-dim);
    }

    .toggle-section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .section-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-per-attack  { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .dot-arcane-pool  { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
    .dot-conditional { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
    .dot-buff        { background: var(--dmg-fire); box-shadow: 0 0 6px var(--dmg-fire); }

    .section-eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .section-eyebrow.per-attack  { color: var(--gold-dim); }
    .section-eyebrow.arcane-pool  { color: var(--teal-dim); }
    .section-eyebrow.conditional { color: var(--orange-dim); }
    .section-eyebrow.buff        { color: var(--dmg-fire); opacity: 0.75; }

    .toggle-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      border-radius: 3px;
      padding: 0.3em 0.6em;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.15s;
      position: relative;
    }

    .toggle-chip input[type=checkbox] { display: none; }

    .chip-box {
      width: 0.9em;
      height: 0.9em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7em;
      flex-shrink: 0;
    }

    .chip-label { font-weight: 600; }
    .chip-effect { opacity: 0.7; font-size: 0.85em; }

    .chip-arcane-cost {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 0.55rem;
      color: var(--spell-purple);
      background: var(--bg-card);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ON states */
    .chip-on-gold {
      background: #1a1408;
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .chip-on-teal {
      background: #091820;
      border-color: var(--teal-dim);
      color: var(--teal);
    }

    .chip-on-orange {
      background: #1a100a;
      border-color: var(--orange-dim);
      color: var(--orange);
    }

    .chip-on-fire {
      background: #1a0d06;
      border-color: #7c2e10;
      color: var(--dmg-fire);
    }

    /* OFF state */
    .chip-off {
      background: #0a0f1a;
      border-color: #1a2535;
      color: var(--text-dim);
    }

    .chip-off:hover {
      border-color: #2a3a55;
      color: var(--text-primary);
    }

    /* ── ATTACK SECTION ─────────────────────────────────────── */
    .attacks-section {
      padding: 0.5rem 0 0.25rem;
    }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0.4rem 1.4rem 0.2rem;
    }

    .attack-row {
      padding: 0.55rem 1.4rem;
      border-bottom: 1px solid #0e1520;
      position: relative;
      transition: background 0.15s;
    }

    .attack-row:hover { background: #111827; }

    .attack-row.spellstrike {
      background: #0e0f1f;
      border-left: 3px solid var(--spell-purple);
    }

    .attack-row.spellstrike:hover { background: #12132a; }

    .atk-index {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      width: 60px;
      flex-shrink: 0;
    }

    .atk-label {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .atk-label strong {
      font-style: normal;
      font-weight: 600;
      color: var(--text-primary);
    }

    .to-hit {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--hit-green);
      text-shadow: 0 0 10px #86efac55;
      min-width: 52px;
      text-align: center;
      line-height: 1;
    }

    .to-hit.spellstrike-hit {
      color: var(--spell-purple);
      text-shadow: 0 0 10px #a78bfa55;
    }

    .dmg-block { 
      display: flex;
      justify-content: space-between;
      min-width: 120px; 
    }

    .dmg-dice {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--dmg-amber);
      line-height: 1.1;
    }

    .dmg-dice.spell-dmg {
      color: var(--spell-purple);
      text-shadow: 0 0 8px var(--spell-glow);
    }

    .dmg-type {
      font-family: 'Crimson Pro', serif;
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 1px;
    }

    /* ── SPELL BANNER ────────────────────────────────────────── */
    .spell-banner {
      background: #0d0d20;
      border: 1px solid #2e2060;
      border-radius: 4px;
      padding: 0.45rem 0.75rem;
      margin: 0.3rem 1.4rem 0.4rem;
      position: relative;
      overflow: hidden;
    }

    .spell-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #7c3aed18 0%, transparent 65%);
      pointer-events: none;
    }

    .spell-banner { cursor: pointer; }
    .spell-banner:hover { border-color: #5040a0; }

    .spell-select-prompt {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: var(--spell-purple);
      opacity: 0.7;
      letter-spacing: 0.06em;
    }

    .spell-icon { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }

    .spell-name {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--spell-purple);
      text-shadow: 0 0 10px var(--spell-glow);
      letter-spacing: 0.04em;
    }

    .spell-detail {
      font-family: 'Crimson Pro', serif;
      font-size: 0.75rem;
      color: #c4b5fd;
      margin-top: 2px;
    }

    .spell-meta {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      color: #6d5fa8;
      letter-spacing: 0.1em;
    }

    /* ── SPELL SELECTOR PANEL ────────────────────────────────── */
    .spell-selector-panel {
      border-top: 1px solid var(--border-dim);
      background: #0b0f1c;
      padding: 0.75rem 1.4rem 1rem;
    }

    .spell-selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .spell-selector-title {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--spell-purple);
    }

    .spell-selector-close {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      letter-spacing: 0.08em;
    }

    .spell-selector-close:hover { color: var(--text-primary); }

    .spell-list { display: flex; flex-direction: column; gap: 0.3rem; }

    .spell-item {
      background: #0d1220;
      border: 1px solid #1e2d4a;
      border-radius: 3px;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .spell-item:hover { border-color: var(--spell-glow); background: #0e0f20; }

    .spell-item.selected {
      border-color: var(--spell-purple);
      background: #100e20;
    }

    .spell-item-name {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: var(--spell-purple);
      font-weight: 600;
    }

    .spell-item-meta {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      color: #6d5fa8;
      letter-spacing: 0.08em;
    }

    .spell-item-detail {
      font-family: 'Crimson Pro', serif;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .spell-none {
      font-family: 'Crimson Pro', serif;
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
      padding: 0.5rem;
    }

    /* ── CARD FOOTER ─────────────────────────────────────────── */
    .card-footer-custom {
      padding: 0.6rem 1.4rem 0.9rem;
      border-top: 1px solid var(--border-dim);
      background: #0a0f1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .reset-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: none;
      border: 1px solid #1e2d4a;
      border-radius: 3px;
      padding: 0.3em 0.8em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .reset-btn:hover { border-color: var(--gold-dim); color: var(--gold-dim); }

    .divider-rune {
      text-align: center;
      font-size: 0.7rem;
      color: var(--border-dim);
      letter-spacing: 0.5em;
      padding: 0.25rem 0;
    }

    /* ── EXTRA DAMAGE TAGS ───────────────────────────────────── */
    .extra-dmg-row {
      padding: 0.1rem 1.4rem 0.3rem 76px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: right;
    }

    .extra-dmg-tag {
      font-family: 'Crimson Pro', serif;
      font-size: 0.72rem;
      color: var(--dmg-amber);
      opacity: 0.85;
      padding-right: 1em;
    }

    .dmg-fire        { color: var(--dmg-fire); }
    .dmg-acid        { color: var(--dmg-acid); }
    .dmg-cold        { color: var(--dmg-cold); }
    .dmg-electricity { color: var(--dmg-electricity); }
    .dmg-sonic       { color: var(--dmg-sonic); }
    .dmg-force       { color: var(--dmg-force); }
    .dmg-bleed       { color: var(--dmg-bleed); }

    .extra-dmg-crit {
      font-size: 0.65rem;
      opacity: 0.65;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     UPLOAD SCREEN
══════════════════════════════════════════ -->
<div id="upload-section" class="upload-screen">
  <div class="upload-title">Eldritch Archer</div>
  <div class="upload-subtitle">Combat Tracker · Pathfinder</div>

  <div id="drop-zone" class="drop-zone">
    <div class="drop-zone-icon">🏹</div>
    <div class="drop-zone-text">Drop your Hero Lab portfolio here<br>or click to browse</div>
  </div>

  <input type="file" id="portfolio-file" accept=".por" style="display:none" />
  <div id="upload-status" class="upload-status"></div>
</div>

<!-- ══════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════ -->
<div id="app-section" style="display:none">
<div class="attack-card">

  <!-- HEADER -->
  <div class="card-header-custom">
    <div class="d-flex align-items-start justify-content-between gap-2">
      <div>
        <div class="char-name" id="char-name">—</div>
        <div class="char-meta" id="char-summary">—</div>
      </div>
      <div class="d-flex flex-column align-items-end gap-1">
        <span class="action-badge mt-1">Full Attack</span>
        <a href="#" id="change-character-link" class="change-char-link">change character</a>
      </div>
    </div>
  </div>

  <!-- ARCANE POOL -->
  <div class="arcane-pool-row">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <span class="pool-label">Arcane Pool</span>
        <span class="pool-available" id="arcane-available"></span>
      </div>
      <div id="arcane-pips"></div>
    </div>
    <div class="arcane-cost-display" id="arcane-cost-display" style="display:none"></div>
  </div>

  <!-- WEAPON -->
  <div class="weapon-row">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="weapon-name">
        <span id="weapon-name">—</span>
        <span class="crit-tag" id="weapon-crit"></span>
      </div>
      <div class="d-flex flex-wrap gap-1">
        <span class="stat-pill">RNG <span id="weapon-range">—</span></span>
        <span class="stat-pill" id="weapon-dmg-type-pill">Type <span id="weapon-damage-type">—</span></span>
      </div>
    </div>
    <div class="weapon-situational" style="display:none">
      <small class="text-muted" id="situational-modifiers"></small>
    </div>
  </div>

  <!-- PER-ATTACK OPTIONS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-per-attack"></span>
      <span class="section-eyebrow per-attack">Per-Attack Decisions</span>
    </div>
    <div class="toggle-grid" id="options-grid-per-attack"></div>
  </div>

  <!-- SWIFT-ACTION BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-arcane-pool"></span>
      <span class="section-eyebrow arcane-pool">Arcane Pool</span>
    </div>
    <div class="toggle-grid" id="options-grid-arcane-pool"></div>
  </div>

  <!-- CONDITIONAL BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-conditional"></span>
      <span class="section-eyebrow conditional">Conditional</span>
    </div>
    <div class="toggle-grid" id="options-grid-conditional"></div>
  </div>

  <!-- ACTIVE BUFFS -->
  <div class="toggle-section">
    <div class="toggle-section-header">
      <span class="section-dot dot-buff"></span>
      <span class="section-eyebrow buff">Active Buffs</span>
    </div>
    <div class="toggle-grid" id="options-grid-buff"></div>
  </div>

  <!-- ATTACKS -->
  <div class="attacks-section">
    <div class="section-label">Full Attack</div>
    <div id="attacks-list"></div>
  </div>

  <!-- SPELL SELECTOR -->
  <div class="spell-selector-panel" id="spell-selector-panel" style="display:none">
    <div class="spell-selector-header">
      <span class="spell-selector-title">⚡ Select Spellstrike Spell</span>
      <button class="spell-selector-close" id="spell-selector-close">✕ Close</button>
    </div>
    <div class="spell-list" id="spell-list"></div>
  </div>

  <!-- FOOTER -->
  <div class="card-footer-custom">
    <div style="font-family:'Cinzel',serif; font-size:0.58rem; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase;">
      Click pips to mark arcane pool spent
    </div>
    <button class="reset-btn" id="reset-round-btn">New Round</button>
  </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
